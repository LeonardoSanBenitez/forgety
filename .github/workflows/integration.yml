name: integration

# Integration tests against the REAL I-CARE data on HuggingFace. They guard against
# drift in the published data/schema, which moves slowly -- so they run on a weekly
# schedule (and on demand), never per-push: a per-push non-blocking job becomes noise
# that everyone learns to ignore, and a network hiccup must never redden a commit.
on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/vision-unlearning
    steps:
      - uses: actions/checkout@v4
        with:
          path: forgety

      - uses: actions/checkout@v4
        with:
          repository: LeonardoSanBenitez/vision-unlearning
          ref: dev
          path: vision-unlearning

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            forgety/services/backend/requirements.txt
            forgety/libs/requirements.txt
            forgety/libs/requirements.dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r forgety/services/backend/requirements.txt \
            -r forgety/libs/requirements.txt \
            -r forgety/libs/requirements.dev.txt

      - name: Pytest (HuggingFace integration)
        working-directory: forgety
        run: python -m pytest tests -m integration
