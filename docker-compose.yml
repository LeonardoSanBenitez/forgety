services:
  backend:
    container_name: platform-backend
    build:
      context: .
      dockerfile: ./services/backend/Dockerfile
    command: ["/bin/sh", "-c", "service ssh start && exec uvicorn app.main:app --host 0.0.0.0 --port 80 --reload"]
    volumes:
      - ./services/backend/app:/src/app
      - ./assets:/src/assets
      - ./libs:/src/libs
      - ./tests:/tests
      # vision-unlearning is not yet installed as a package; mount the source tree directly.
      # TODO: remove this mount once vision-unlearning is published and installed via pip.
      - ../vision-unlearning:/vision_unlearning_src
    env_file:
      - .env
    environment:
      - PYTHONPATH=/src:/vision_unlearning_src
      - HF_HUB_ETAG_TIMEOUT=120
    ports:
      - 8001:80
      - 2222:22

  frontend:
    container_name: platform-frontend
    build:
      context: .
      dockerfile: ./services/frontend/Dockerfile
    command: ["streamlit", "run", "app/main.py", "--server.port=80", "--server.address=0.0.0.0"]
    volumes:
      - ./services/frontend/app:/src/app
      - ./libs:/src/libs
      # vision-unlearning is not yet installed as a package; mount the source tree directly.
      # TODO: remove this mount once vision-unlearning is published and installed via pip.
      - ../vision-unlearning:/vision_unlearning_src
    env_file:
      - .env
    environment:
      - PYTHONPATH=/src:/vision_unlearning_src
    ports:
      - 8501:80

  mcp:
    container_name: platform-mcp
    build:
      context: .
      dockerfile: ./services/mcp/Dockerfile
    command: ["python", "app/server.py"]
    volumes:
      - ./services/mcp/app:/src/app
      - ./assets:/src/assets
      - ./libs:/src/libs
      # vision-unlearning is not yet installed as a package; mount the source tree directly.
      # TODO: remove this mount once vision-unlearning is published and installed via pip.
      - ../vision-unlearning:/vision_unlearning_src
    env_file:
      - .env
    environment:
      - PYTHONPATH=/src:/vision_unlearning_src
      - HF_HUB_ETAG_TIMEOUT=120
    ports:
      - 8002:80